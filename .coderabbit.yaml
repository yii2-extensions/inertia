# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repo-specific config for yii2-extensions/inertia
language: en-US
tone_instructions: |
  Be concise and direct. Lead with the issue and the fix. Focus on bugs, Inertia.js
  protocol conformance, immutable Page/prop payloads, asset versioning, and backward
  compatibility.
early_access: true
enable_free_tier: true
inheritance: false
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions:
    - label: "bug"
      instructions: "Apply when the PR fixes incorrect behavior, an exception, or a regression."
    - label: "enhancement"
      instructions: "Apply when the PR adds a new feature, capability, or public API."
    - label: "documentation"
      instructions: "Apply when the PR only changes docs/, README, or PHPDoc."
    - label: "dependencies"
      instructions: "Apply when composer.json or composer.lock changes."
    - label: "github_actions"
      instructions: "Apply when files under .github/workflows/ change."
    - label: "php"
      instructions: "Apply when the PR changes PHP source files (src/, tests/, or any *.php)."
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: true
  poem: true
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!vendor/**"
    - "!.phpunit.cache/**"
    - "!build/**"
    - "!coverage/**"
    - "!runtime/**"
    - "!tests/data/build/**"
  path_instructions:
    - path: "src/**/*.php"
      instructions: |
        Inertia.js server-side integration layer for Yii2 (namespace yii\inertia\,
        PSR-4 -> src/). Target PHP >= 8.3 and yiisoft/yii2 ^22. Enforce
        declare(strict_types=1) and full type declarations. Respect the repo's existing
        toolchain: php-forge/coding-standard (ECS, built on phpcs) and phpstan
        strict-rules. Do NOT suggest changes that conflict with phpstan.neon, ecs.php,
        or rector.php.
        Public API is wired into the Yii application through Bootstrap
        (BootstrapInterface); Inertia is a static facade over the Manager component.
        Page is an immutable JsonSerializable payload, and the prop wrappers
        (AlwaysProp, DeferredProp, MergeProp, OnceProp, OptionalProp) are lazy/conditional
        evaluation markers — preserve their immutability and serialization semantics.
        Flag changes to public signatures, defaults, or return types of Manager, Inertia,
        Page, Controller, Vite, or the prop wrappers, and call out backward-incompatible
        changes explicitly (pre-1.0, so they land in minor releases, but must be
        intentional and documented).
    - path: "src/web/**/*.php"
      instructions: |
        Inertia HTTP layer (Controller, Request). Honor the Inertia protocol exactly:
        detect X-Inertia requests and return the JSON page payload instead of the full
        HTML document; surface an asset-version mismatch as a 409 Conflict with the
        X-Inertia-Location header; respect partial reloads (X-Inertia-Partial-Data and
        X-Inertia-Partial-Component); and issue 303 See Other redirects after
        PUT/PATCH/DELETE so the client follows with GET.
    - path: "src/views/**/*.php"
      instructions: |
        Server-rendered root template (app.php) that boots the client app. Escape every
        server value injected into the document (Html::encode, or a safe JSON encode for
        the data-page attribute); keep application logic out of the view.
    - path: "tests/**/*.php"
      instructions: |
        PHPUnit 12.5 tests; the repo also runs Infection (mutation testing, 100% MSI — see
        infection.json5) and xepozz/internal-mocker (MockerExtension in phpunit.xml.dist).
        Cover new behavior plus failure/edge paths; assertions must be strong enough to
        survive mutation testing (no empty test bodies). Use the existing fixtures under
        tests/data and stubs under tests/stub and tests/support.
    - path: "composer.json"
      instructions: |
        Library manifest. Keep require/require-dev accurate (the repo runs
        composer-require-checker): no unused or undeclared dependencies. Respect the
        supported ranges php >=8.3 and yiisoft/yii2 ^22.0@dev.
    - path: "docs/**/*.md"
      instructions: |
        Documentation (installation, configuration, examples, testing). Ensure code
        samples match the current public API.
  abort_on_close: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
    description:
      mode: warning
    issue_assessment:
      mode: warning
  tools:
    # --- Core for this PHP library ---
    ast-grep:
      essential_rules: true
    phpstan:
      enabled: true
    phpcs:
      enabled: true
    # --- CI / docs / security (relevant to this repo) ---
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    # --- Disabled: redundant with this repo's toolchain (ECS/phpcs + phpstan strict) ---
    phpmd:
      enabled: false
    # --- Disabled: no Docker / JS / CSS / other languages in this repo ---
    hadolint:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    stylelint:
      enabled: false
    htmlhint:
      enabled: false
    flake8:
      enabled: false
    ruff:
      enabled: false
    pylint:
      enabled: false
    swiftlint:
      enabled: false
    golangci-lint:
      enabled: false
    detekt:
      enabled: false
    fortitudeLint:
      enabled: false
    rubocop:
      enabled: false
    brakeman:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    pmd:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    clippy:
      enabled: false
    sqlfluff:
      enabled: false
    prismaLint:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    psscriptanalyzer:
      enabled: false
    blinter:
      enabled: false
    checkmake:
      enabled: false
    dotenvLint:
      enabled: false
    circleci:
      enabled: false
    checkov:
      enabled: false
    tflint:
      enabled: false
    trivy:
      enabled: false
chat:
  art: true
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto
knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CONTRIBUTING.md"
      - "**/.github/CONTRIBUTING.md"
      - "**/ecs.php"
      - "**/phpstan.neon*"
      - "**/rector.php"
      - "**/docs/testing.md"
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
  linear:
    usage: auto
  pull_requests:
    scope: auto
  mcp:
    usage: auto
code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "src/**/*.php"
        instructions: |
          Write PHPDoc in English. Document @param/@return/@throws with concrete types
          matching the PHP type hints. Use precise phpstan collection/shape syntax for arrays
          (e.g. array<string, mixed> for maps, array{foo: string, bar?: int} for shapes).
          Note immutability on Page and the prop wrappers.
  unit_tests:
    path_instructions:
      - path: "tests/**/*.php"
        instructions: |
          Generate PHPUnit 12.5 tests using the project's existing base TestCase and
          conventions. Cover happy path plus edge/failure cases. Write assertions strong
          enough to survive Infection mutation testing (100% MSI). No real network; use the
          existing fixtures under tests/data and stubs under tests/stub and tests/support.
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
  labeling:
    labeling_instructions:
      - label: "bug"
        instructions: "Apply when the issue reports incorrect behavior, an error, or a regression."
      - label: "enhancement"
        instructions: "Apply when the issue requests a new feature or capability."
      - label: "documentation"
        instructions: "Apply when the issue is about docs, README, or guides."
      - label: "question"
        instructions: "Apply when the issue is a usage question or asks for clarification rather than reporting a defect."
    auto_apply_labels: true
